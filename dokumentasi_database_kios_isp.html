      { fromTable: 'check_odp_ports', fromCol: 'pppoe_secret_updated', toTable: 'customers', toCol: 'pppoe_secret', type: 'One-to-One', desc: 'Pelanggan terverifikasi menempati port ODP.' },

      { fromTable: 'prospects_points', fromCol: 'place_id', toTable: 'prospects_places', toCol: 'id', type: 'Many-to-One', desc: 'Titik koordinat jalur survei prospek.' },
    ];

    // =========================================================================
    // 3. STATE MANAGEMENT & HELPER FUNCTIONS
    // =========================================================================
    let state = {
      view: 'overview', // 'overview' | 'schema' | 'table'
      selectedSchemaId: null,
      selectedTableName: null,
      sidebarSchemaFilter: 'all',
      searchQuery: '',
      keyFilter: 'all', // 'all' | 'PK' | 'FK' | 'UQ'
    };

    // Flatten lookup maps
    const allTablesMap = new Map();
    const schemaMap = new Map();

    DB_SCHEMAS.forEach(schema => {
      schemaMap.set(schema.id, schema);
      schema.tables.forEach(tbl => {
        allTablesMap.set(tbl.name, tbl);
      });
    });

    const colorThemes = {
      blue: {
        bg: 'bg-blue-50 dark:bg-blue-950/40',
        text: 'text-blue-700 dark:text-blue-300',
        border: 'border-blue-200 dark:border-blue-800/60',
        dot: 'bg-blue-500',
        badge: 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300',
      },
      emerald: {
        bg: 'bg-emerald-50 dark:bg-emerald-950/40',
        text: 'text-emerald-700 dark:text-emerald-300',
        border: 'border-emerald-200 dark:border-emerald-800/60',
        dot: 'bg-emerald-500',
        badge: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300',
      },
      amber: {
        bg: 'bg-amber-50 dark:bg-amber-950/40',
        text: 'text-amber-700 dark:text-amber-300',
        border: 'border-amber-200 dark:border-amber-800/60',
        dot: 'bg-amber-500',
        badge: 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300',
      },
      purple: {
        bg: 'bg-purple-50 dark:bg-purple-950/40',
        text: 'text-purple-700 dark:text-purple-300',
        border: 'border-purple-200 dark:border-purple-800/60',
        dot: 'bg-purple-500',
        badge: 'bg-purple-100 text-purple-800 dark:bg-purple-900/60 dark:text-purple-300',
      },
    };

    function getSchemaTheme(schemaId) {
      const schema = schemaMap.get(schemaId);
      return colorThemes[schema ? schema.badgeColor : 'blue'];
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2400);
    }

    function copyText(text, label) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(label || `Disalin: ${text}`);
      } catch (e) {
        showToast('Gagal menyalin teks');
      }
      document.body.removeChild(textarea);
    }

    // =========================================================================
    // 4. NAVIGATION ACTIONS
    // =========================================================================
    function showOverview() {
      state.view = 'overview';
      state.selectedSchemaId = null;
      state.selectedTableName = null;
      closeMobileSidebar();
      renderSidebar();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectSchema(schemaId) {
      state.view = 'schema';
      state.selectedSchemaId = schemaId;
      state.selectedTableName = null;
      closeMobileSidebar();
      renderSidebar();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectTable(tableName) {
      const tbl = allTablesMap.get(tableName);
      if (!tbl) return;
      state.view = 'table';
      state.selectedSchemaId = tbl.schema;
      state.selectedTableName = tableName;
      state.keyFilter = 'all';
      closeMobileSidebar();
      renderSidebar();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setSidebarFilter(filterId) {
      state.sidebarSchemaFilter = filterId;
      renderSidebar();
    }

    function setKeyFilter(keyType) {
      state.keyFilter = keyType;
      renderMain();
    }

    // =========================================================================
    // 5. RENDER SIDEBAR
    // =========================================================================
    function renderSidebar() {
      const filterContainer = document.getElementById('schemaFilterBtns');
      const treeContainer = document.getElementById('sidebarTree');
      const countBadge = document.getElementById('tableCountBadge');

      const filters = [
        { id: 'all', label: 'Semua (4)' },
        { id: 'kios_company', label: 'Company' },
        { id: 'kios_coverage', label: 'Coverage' },
        { id: 'kios_customers', label: 'Customers' },
        { id: 'kios_oprasional', label: 'Oprasional' },
      ];

      filterContainer.innerHTML = filters.map(f => {
        const active = state.sidebarSchemaFilter === f.id;
        return `
          <button type="button" onclick="setSidebarFilter('${f.id}')"
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-left truncate transition ${
              active
                ? 'bg-indigo-600 text-white shadow-xs'
                : 'bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800'
            }">
            ${f.label}
          </button>
        `;
      }).join('');

      const q = state.searchQuery.trim().toLowerCase();
      let visibleTablesCount = 0;

      const htmlParts = DB_SCHEMAS.filter(s => state.sidebarSchemaFilter === 'all' || s.id === state.sidebarSchemaFilter).map(schema => {
        const theme = getSchemaTheme(schema.id);
        const matchingTables = schema.tables.filter(tbl => {
          if (!q) return true;
          if (tbl.name.toLowerCase().includes(q) || tbl.description.toLowerCase().includes(q) || schema.name.toLowerCase().includes(q)) return true;
          return tbl.columns.some(c => c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
        });

        visibleTablesCount += matchingTables.length;

        if (matchingTables.length === 0 && q) return '';

        const isSchemaSelected = state.view === 'schema' && state.selectedSchemaId === schema.id;

        return `
          <div class="space-y-1">
            <button type="button" onclick="selectSchema('${schema.id}')"
              class="w-full flex items-center justify-between px-2.5 py-2 rounded-xl text-xs font-semibold transition group ${
                isSchemaSelected
                  ? `${theme.bg} ${theme.text} ring-1 ring-inset ${theme.border}`
                  : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800/70'
              }">
              <span class="flex items-center gap-2 truncate">
                <span class="w-2 h-2 rounded-full ${theme.dot} shrink-0"></span>
                <span class="font-mono truncate">${schema.name}</span>
              </span>
              <span class="text-[11px] font-mono px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                ${matchingTables.length}
              </span>
            </button>

            <div class="pl-3 space-y-0.5 border-l border-slate-200 dark:border-slate-800 ml-3">
              ${matchingTables.map(tbl => {
                const active = state.view === 'table' && state.selectedTableName === tbl.name;
                return `
                  <button type="button" onclick="selectTable('${tbl.name}')"
                    class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-mono transition text-left ${
                      active
                        ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-semibold'
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-200'
                    }">
                    <span class="truncate">${tbl.name}</span>
                    <span class="text-[10px] opacity-60 ml-2 shrink-0">${tbl.columns.length}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      countBadge.textContent = `${visibleTablesCount} Tabel`;
      treeContainer.innerHTML = htmlParts.join('') || `
        <div class="text-center py-8 px-4">
          <p class="text-xs text-slate-500 dark:text-slate-400">Tidak ada tabel atau field yang cocok dengan "<span class="font-semibold">${escapeHtml(state.searchQuery)}</span>".</p>
        </div>
      `;
    }

    // =========================================================================
    // 6. RENDER MAIN CONTENT VIEWS
    // =========================================================================
    function renderMain() {
      const container = document.getElementById('mainContent');
      const q = state.searchQuery.trim().toLowerCase();

      // If user is typing in global search while on overview, show live search results banner
      if (q && state.view === 'overview') {
        renderSearchResultsView(container, q);
        return;
      }

      if (state.view === 'overview') {
        renderOverviewView(container);
      } else if (state.view === 'schema') {
        renderSchemaView(container, state.selectedSchemaId);
      } else if (state.view === 'table') {
        renderTableView(container, state.selectedTableName);
      }
    }

    // --- VIEW C: TABLE DETAIL (FIELDS, DESCRIPTIONS & RELATIONS) ---

          col.name.toLowerCase().includes(q) ||
          col.type.toLowerCase().includes(q) ||
          col.desc.toLowerCase().includes(q);
        return matchKey && matchQuery;
      });

      const pkCount = tbl.columns.filter(c => c.key === 'PK').length;
      const fkCount = tbl.columns.filter(c => c.key === 'FK').length;
      const uqCount = tbl.columns.filter(c => c.key === 'UQ').length;

      container.innerHTML = `
        <div class="max-w-6xl mx-auto space-y-6">

            <button onclick="showOverview()" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">Ringkasan</button>
            <span>/</span>
            <button onclick="selectSchema('${schema.id}')" class="font-mono hover:text-indigo-600 dark:hover:text-indigo-400 transition">${schema.name}</button>
            <span>/</span>
            <span class="font-mono font-semibold text-slate-800 dark:text-slate-200">${tbl.name}</span>
          </nav>

          <!-- Table Header Card -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <div class="flex items-center gap-2">
                <button onclick="selectSchema('${schema.id}')" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-mono font-semibold ${theme.badge} hover:opacity-90 transition">
                  <span class="w-2 h-2 rounded-full ${theme.dot}"></span>
                  ${schema.name}
                </button>
                <span class="text-xs font-mono px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                  ${tbl.columns.length} Variabel/Field
                </span>
              </div>

              <button type="button" onclick="copyText('${schema.name}.${tbl.name}', 'Nama lengkap tabel disalin!')"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-mono bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                ${schema.name}.${tbl.name}
              </button>
            </div>

            <h2 class="text-2xl sm:text-3xl font-bold font-mono text-slate-900 dark:text-white tracking-tight">
              ${tbl.name}
            </h2>
            <p class="mt-2.5 text-sm sm:text-base text-slate-600 dark:text-slate-400 leading-relaxed max-w-4xl">
              ${tbl.description}
            </p>
          </div>

          <!-- Fields / Columns Dictionary Section -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs overflow-hidden">
            <div class="p-4 sm:p-6 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white">Struktur Variabel / Field</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Daftar lengkap kolom, tipe data MySQL, constraint kunci, dan fungsi bisnis masing-masing field.</p>
              </div>

              <!-- Key Filter Buttons -->
              <div class="flex flex-wrap items-center gap-1.5">
                <button onclick="setKeyFilter('all')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${state.keyFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  Semua (${tbl.columns.length})
                </button>
                <button onclick="setKeyFilter('PK')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${state.keyFilter === 'PK' ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  PK (${pkCount})
                </button>
                <button onclick="setKeyFilter('FK')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${state.keyFilter === 'FK' ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  FK (${fkCount})
                </button>
                <button onclick="setKeyFilter('UQ')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${state.keyFilter === 'UQ' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  Unique (${uqCount})
                </button>
              </div>
            </div>

            <!-- Responsive Table -->
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                    <th class="py-3.5 px-4 sm:px-6 w-12">#</th>
                    <th class="py-3.5 px-4">Nama Variabel / Field</th>
                    <th class="py-3.5 px-4">Tipe Data</th>
                    <th class="py-3.5 px-4">Atribut</th>
                    <th class="py-3.5 px-4 sm:px-6 min-w-[280px]">Deskripsi Field</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800/80 text-sm">
                  ${filteredColumns.map((col, idx) => {
                    const relForCol = outgoingRelations.find(r => r.fromCol === col.name);
                    let keyBadge = '';
                    if (col.key === 'PK') {
                      keyBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-mono font-bold bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800">PK</span>`;
                    } else if (col.key === 'FK') {
                      keyBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-mono font-bold bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 border border-blue-200 dark:border-blue-800">FK</span>`;
                    } else if (col.key === 'UQ') {
                      keyBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-mono font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">UQ</span>`;
                    }

                    return `
                      <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition align-top">
                        <td class="py-3.5 px-4 sm:px-6 font-mono text-xs text-slate-400">${idx + 1}</td>
                        <td class="py-3.5 px-4">
                          <div class="flex items-center gap-2">
                            <span class="font-mono font-semibold text-slate-900 dark:text-white cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400"
                              onclick="copyText('${col.name}', 'Nama field disalin: ${col.name}')">
                              ${escapeHtml(col.name)}
                            </span>
                            ${keyBadge}
                          </div>
                          ${relForCol ? `
                            <button type="button" onclick="selectTable('${relForCol.toTable}')"
                              class="mt-1.5 inline-flex items-center gap-1 text-[11px] font-mono text-indigo-600 dark:text-indigo-400 hover:underline">
                              <span>→ ${relForCol.toTable}.${relForCol.toCol}</span>
                            </button>
                          ` : ''}
                        </td>
                        <td class="py-3.5 px-4">
                          <code class="text-xs font-mono px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 break-all inline-block max-w-[220px]">
                            ${escapeHtml(col.type)}
                          </code>
                        </td>
                        <td class="py-3.5 px-4 text-xs">
                          <div class="space-y-1">
                            <div>
                              ${col.nullable
                                ? '<span class="text-slate-400 dark:text-slate-500 font-mono">NULLABLE</span>'
                                : '<span class="text-rose-600 dark:text-rose-400 font-mono font-medium">NOT NULL</span>'}
                            </div>
                            ${col.defaultVal !== '-' ? `
                              <div class="text-[11px] text-slate-500 dark:text-slate-400 font-mono">
                                Def: <span class="text-slate-700 dark:text-slate-300">${escapeHtml(col.defaultVal)}</span>
                              </div>
                            ` : ''}
                          </div>
                        </td>
                        <td class="py-3.5 px-4 sm:px-6 text-slate-600 dark:text-slate-300 leading-relaxed text-[13px]">
                          ${escapeHtml(col.desc)}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Relations Card -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 shadow-xs">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white">Pemetaan Relasi Tabel</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Keterhubungan tabel <code class="font-mono">${tbl.name}</code> dengan tabel lain di seluruh skema database (klik tabel tujuan untuk berpindah).</p>
              </div>
              <span class="text-xs font-mono px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                ${outgoingRelations.length + incomingRelations.length} Relasi
              </span>
            </div>

            ${(outgoingRelations.length === 0 && incomingRelations.length === 0) ? `
              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 text-xs text-slate-500 dark:text-slate-400 text-center">
                Tabel ini berdiri independen (log/snapshot) dan tidak memiliki relasi kunci langsung ke tabel lain.
              </div>
            ` : `
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Outgoing Relations -->
                <div>
                  <h4 class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-3 flex items-center gap-1.5">
                    <span>↗ Relasi Keluar / Merujuk Ke (${outgoingRelations.length})</span>
                  </h4>
                  ${outgoingRelations.length === 0 ? `
                    <p class="text-xs text-slate-400 italic p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40">Tidak ada foreign key keluar dari tabel ini.</p>
                  ` : `
                    <div class="space-y-2.5">
                      ${outgoingRelations.map(r => {
                        const targetTbl = allTablesMap.get(r.toTable);
                        const targetTheme = targetTbl ? getSchemaTheme(targetTbl.schema) : colorThemes.blue;
                        return `
                          <div onclick="selectTable('${r.toTable}')"
                            class="cursor-pointer p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-indigo-50/70 dark:hover:bg-indigo-950/30 border border-slate-200/80 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700 transition">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
                              <div class="font-mono text-xs">
                                <span class="font-semibold text-slate-700 dark:text-slate-200">${r.fromCol}</span>
                                <span class="text-slate-400 mx-1">→</span>
                                <span class="font-bold text-indigo-600 dark:text-indigo-400">${r.toTable}</span><span class="text-slate-500">.${r.toCol}</span>
                              </div>
                              <span class="text-[10px] font-mono px-2 py-0.5 rounded-md ${targetTheme.badge}">
                                ${targetTbl ? targetTbl.schema : ''}
                              </span>
                            </div>
                            <div class="flex items-center justify-between gap-2 text-xs text-slate-600 dark:text-slate-400">
                              <span>${escapeHtml(r.desc)}</span>
                              <span class="text-[10px] font-mono text-slate-400 shrink-0">${r.type}</span>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  `}
                </div>

                <!-- Incoming Relations -->
                <div>
                  <h4 class="text-xs font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-3 flex items-center gap-1.5">
                    <span>↙ Direferensikan Oleh Tabel Lain (${incomingRelations.length})</span>
                  </h4>
                  ${incomingRelations.length === 0 ? `
                    <p class="text-xs text-slate-400 italic p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40">Belum ada tabel lain yang merujuk ke tabel ini.</p>
                  ` : `
                    <div class="space-y-2.5">
                      ${incomingRelations.map(r => {
                        const sourceTbl = allTablesMap.get(r.fromTable);
                        const sourceTheme = sourceTbl ? getSchemaTheme(sourceTbl.schema) : colorThemes.emerald;
                        return `
                          <div onclick="selectTable('${r.fromTable}')"
                            class="cursor-pointer p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-emerald-50/60 dark:hover:bg-emerald-950/20 border border-slate-200/80 dark:border-slate-800 hover:border-emerald-300 dark:hover:border-emerald-700 transition">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
                              <div class="font-mono text-xs">
                                <span class="font-bold text-emerald-600 dark:text-emerald-400">${r.fromTable}</span><span class="text-slate-500">.${r.fromCol}</span>
                                <span class="text-slate-400 mx-1">→</span>
                                <span class="font-semibold text-slate-700 dark:text-slate-200">${r.toCol}</span>
                              </div>
                              <span class="text-[10px] font-mono px-2 py-0.5 rounded-md ${sourceTheme.badge}">
                                ${sourceTbl ? sourceTbl.schema : ''}
                              </span>
                            </div>
                            <div class="flex items-center justify-between gap-2 text-xs text-slate-600 dark:text-slate-400">
                              <span>${escapeHtml(r.desc)}</span>
                              <span class="text-[10px] font-mono text-slate-400 shrink-0">${r.type}</span>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  `}
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // --- VIEW D: GLOBAL SEARCH RESULTS ---
    function renderSearchResultsView(container, q) {
      const matchedTables = [];
      const matchedFields = [];

      DB_SCHEMAS.forEach(schema => {
        schema.tables.forEach(tbl => {
          if (tbl.name.toLowerCase().includes(q) || tbl.description.toLowerCase().includes(q)) {
            matchedTables.push(tbl);
          }
          tbl.columns.forEach(col => {
            if (col.name.toLowerCase().includes(q) || col.desc.toLowerCase().includes(q) || col.type.toLowerCase().includes(q)) {
              matchedFields.push({ table: tbl, column: col });
            }
          });
        });
      });

      container.innerHTML = `
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">
                Hasil Pencarian: "<span class="text-indigo-600 dark:text-indigo-400">${escapeHtml(state.searchQuery)}</span>"
              </h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Ditemukan ${matchedTables.length} tabel dan ${matchedFields.length} field yang relevan.
              </p>
            </div>
            <button onclick="clearSearch()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
              Reset Pencarian
            </button>
          </div>

          ${matchedTables.length > 0 ? `
            <div>
              <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">Tabel Cocok (${matchedTables.length})</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${matchedTables.map(tbl => {
                  const theme = getSchemaTheme(tbl.schema);
                  return `
                    <div onclick="selectTable('${tbl.name}')"
                      class="cursor-pointer bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-400 transition">
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <span class="font-mono font-bold text-sm text-indigo-600 dark:text-indigo-400">${tbl.name}</span>
                        <span class="text-[11px] font-mono px-2 py-0.5 rounded-md ${theme.badge}">${tbl.schema}</span>
                      </div>
                      <p class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2">${escapeHtml(tbl.description)}</p>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          ${matchedFields.length > 0 ? `
            <div>
              <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">Variabel / Field Cocok (${matchedFields.length})</h3>
              <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${matchedFields.slice(0, 50).map(({ table, column }) => {
                    const theme = getSchemaTheme(table.schema);
                    return `
                      <div onclick="selectTable('${table.name}')"
                        class="cursor-pointer p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                          <div class="flex flex-wrap items-center gap-2 font-mono text-xs">
                            <span class="font-bold text-slate-900 dark:text-white">${escapeHtml(column.name)}</span>
                            <span class="text-slate-400">di</span>
                            <span class="text-indigo-600 dark:text-indigo-400 font-semibold">${table.name}</span>
                            <span class="px-1.5 py-0.5 rounded text-[10px] ${theme.badge}">${table.schema}</span>
                            <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(column.type)}</span>
                          </div>
                          <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">${escapeHtml(column.desc)}</p>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // =========================================================================
    // 7. SEARCH, THEME & MOBILE DRAWER HANDLERS
    // =========================================================================
    const searchInput = document.getElementById('globalSearch');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    function clearSearch() {
      state.searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      renderSidebar();
      renderMain();
    }

    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      if (state.searchQuery.trim().length > 0) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }
      renderSidebar();
      renderMain();
    });

    clearSearchBtn.addEventListener('click', clearSearch);

    // Keyboard shortcut Ctrl+K / Cmd+K
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // Dark/Light Mode Initialization
    const htmlEl = document.documentElement;
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      htmlEl.classList.add('dark');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      htmlEl.classList.toggle('dark');
    });

    // Mobile Sidebar Drawer
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');

    function openMobileSidebar() {
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    }

    function closeMobileSidebar() {
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    }

    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      if (sidebar.classList.contains('-translate-x-full')) {
        openMobileSidebar();
      } else {
        closeMobileSidebar();
      }
    });

    backdrop.addEventListener('click', closeMobileSidebar);

    // Initial Render
    renderSidebar();
    renderMain();
  </script>
</body>
</html>
